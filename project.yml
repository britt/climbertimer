name: ClimberTimer
options:
  bundleIdPrefix: com.climbertimer
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  ClimberTimer:
    type: application
    platform: iOS
    sources:
      - path: ClimberTimer iOS
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.climbertimer.ios
      INFOPLIST_FILE: ClimberTimer iOS/Info.plist
      CODE_SIGN_ENTITLEMENTS: ClimberTimer iOS/ClimberTimer.entitlements
    entitlements:
      path: ClimberTimer iOS/ClimberTimer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.climbertimer.shared

  ClimberTimer Watch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: ClimberTimer Watch
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.climbertimer.ios.watchkitapp
      INFOPLIST_FILE: ClimberTimer Watch/Info.plist
      CODE_SIGN_ENTITLEMENTS: ClimberTimer Watch/ClimberTimer Watch.entitlements
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
    entitlements:
      path: ClimberTimer Watch/ClimberTimer Watch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.climbertimer.shared

  ClimberTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClimberTimerTests
    dependencies:
      - target: ClimberTimer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.climbertimer.tests
      GENERATE_INFOPLIST_FILE: YES

  ClimberTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClimberTimerUITests
    dependencies:
      - target: ClimberTimer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.climbertimer.uitests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  ClimberTimer:
    build:
      targets:
        ClimberTimer: all
        ClimberTimerTests: [test]
        ClimberTimerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClimberTimerTests
        - ClimberTimerUITests
